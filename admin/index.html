<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гавань — адмін-панель</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: var(--cream-100); }
  #admin { min-height: 100vh; font-family: var(--font-sans); }
  a { color: var(--teal-700); }
  a:hover { color: var(--teal-800); }

  /* ─────── Адаптація адмінки під телефон ─────── */
  html, body { max-width: 100%; overflow-x: hidden; }
  #admin .nav-scrim { display: none; }
  @media (max-width: 900px) {
    #admin > div { grid-template-columns: 1fr !important; }
    /* меню — висувна панель */
    #admin aside {
      position: fixed !important; top: 0; left: 0; bottom: 0; width: min(82vw, 300px);
      z-index: 120; transform: translateX(-104%);
      transition: transform .28s cubic-bezier(.22,1,.36,1);
      overflow-y: auto;
    }
    #admin > div.nav-open aside { transform: none !important; }
    #admin .nav-scrim { position: fixed; inset: 0; z-index: 110; background: rgba(12,59,62,.6); }
    #admin > div.nav-open .nav-scrim { display: block; }
    #admin .nav-toggle { display: inline-flex !important; }
    /* шапка: кнопки в рядок, з переносом */
    #admin main > header { padding: 12px 16px !important; flex-wrap: wrap !important; gap: 12px !important; }
    #admin main > header h2 { font-size: 1.125rem !important; }
    #admin main > header > div:last-child { width: 100%; flex-wrap: wrap !important; }
    #admin main > header > div:last-child button { flex: 1 1 auto; justify-content: center; }
    #admin main > div { padding: 18px 16px 48px !important; }
    /* поля й сітки — в одну колонку */
    #admin main [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  }
</style></head>
<body>
  <div id="admin"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
  <script src="../ds-bundle.js?v=4"></script>
  <script type="text/babel" src="admin-core.jsx?v=4"></script>
  <script type="text/babel" src="admin-auth.jsx?v=4"></script>
  <script type="text/babel" src="admin-github.jsx?v=4"></script>
  <script type="text/babel" src="admin-sections.jsx?v=4"></script>
  <script type="text/babel">
    const NAV = [
      ['hero', 'Головний екран', 'Home'],
      ['amenities', 'Переваги', 'Sparkles'],
      ['newQuarter', 'Новий квартал', 'Building2'],
      ['schemes', 'Схема ділянок', 'Map'],
      ['infrastructure', 'Інфраструктура', 'Wrench'],
      ['gallery', 'Галерея', 'Images'],
      ['contacts', 'Контакти', 'Phone'],
      ['design', 'Вигляд і розміри', 'SlidersHorizontal'],
      ['files', 'Файли', 'FolderOpen'],
      ['publish', 'Публікація', 'UploadCloud'],
    ];

    function App({ onLogout }) {
      const [tab, setTab] = React.useState('hero');
      const [content, setContent] = React.useState(loadContent);
      const [dirty, setDirty] = React.useState(false);
      const [toast, setToast] = React.useState(null);
      const [publish, setPublish] = React.useState(false);
      const [nav, setNav] = React.useState(false);
      const [live, setLive] = React.useState(null);   // текст content.json із сервера
      const [pubBusy, setPubBusy] = React.useState(false);

      const refreshLive = React.useCallback(async () => {
        try {
          const r = await fetch('../content.json?v=' + Date.now(), { cache: 'no-store' });
          setLive(r.ok ? await r.text() : '');
        } catch (e) { setLive(''); }
      }, []);
      React.useEffect(() => { refreshLive(); }, [refreshLive]);

      const strip = (o) => { const c = { ...o }; delete c._savedAt; delete c._publishedAt; return JSON.stringify(c); };
      const norm = (t) => { try { return strip(JSON.parse(t)); } catch (e) { return null; } };
      const isLive = live !== null && live !== '' && norm(live) === strip(content);
      const ghReady = (() => { const g = loadGh(); return !!(g.owner && g.repo && g.token); })();
      const importRef = React.useRef(null);

      const up = (key, val) => { setContent((c) => ({ ...c, [key]: val })); setDirty(true); };
      const flash = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

      const save = () => {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify({ ...content, _savedAt: Date.now() }));
          setDirty(false); flash('Збережено');
        } catch (e) { flash('Не вдалося зберегти — завеликі фото. Скористайтесь експортом.'); }
      };
      const publishNow = async () => {
        const cfg = loadGh();
        if (cfg.owner && cfg.repo && cfg.token) {
          setPubBusy(true);
          const res = await ghPublish(cfg, JSON.stringify({ ...content, _publishedAt: Date.now() }, null, 2));
          setPubBusy(false);
          flash(res.ok ? 'Опубліковано на сайт — зміни з\'являться за 1–2 хв' : res.message);
          if (res.ok) setTimeout(refreshLive, 2500);
          return;
        }
        exportJson();
      };

      const exportJson = () => {
        const blob = new Blob([JSON.stringify({ ...content, _publishedAt: Date.now() }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'content.json'; a.click();
        setPublish(true);
      };
      const importJson = (file) => {
        if (!file) return;
        const fr = new FileReader();
        fr.onload = () => {
          try { setContent({ ...DEFAULTS, ...JSON.parse(fr.result) }); setDirty(true); flash('Імпортовано'); }
          catch (e) { flash('Помилка: файл не є коректним JSON'); }
        };
        fr.readAsText(file);
      };
      const reset = () => {
        if (!window.confirm('Скинути всі зміни до початкових значень?')) return;
        setContent(JSON.parse(JSON.stringify(DEFAULTS))); setDirty(true); flash('Скинуто');
      };

      const Editors = {
        hero: HeroEditor, amenities: AmenitiesEditor, newQuarter: NewQuarterEditor,
        schemes: SchemesEditor, infrastructure: InfraEditor, gallery: GalleryEditor,
        contacts: ContactsEditor, files: FilesEditor, design: DesignEditor,
      };
      // Розділи, яких може не бути в старіших версіях файлів — підключаємо безпечно,
      // щоб розбіжність версій ніколи не блокувала всю панель.
      if (typeof PublishEditor !== 'undefined') Editors.publish = PublishEditor;

      const Missing = ({ name }) => (
        <Panel title="Розділ недоступний"
          desc={'Файл цього розділу («' + name + '») старішої версії або не залитий у папку admin/.'}>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: '0.9375rem', color: 'var(--ink-600)', lineHeight: 1.6, margin: 0 }}>
            Решта розділів працює як звичайно. Щоб увімкнути цей — залийте свіжий <b>admin-sections.jsx</b> у папку <b>admin/</b>.
          </p>
        </Panel>
      );
      const Current = Editors[tab] || (() => <Missing name={tab} />);

      return (
        <div className={nav ? 'nav-open' : ''} style={{ display: 'grid', gridTemplateColumns: '272px 1fr', minHeight: '100vh' }}>
          <div className="nav-scrim" onClick={() => setNav(false)}></div>
          {/* Sidebar */}
          <aside style={{ background: 'var(--teal-900)', padding: '24px 18px', display: 'flex', flexDirection: 'column', gap: 24 }}>
            <img src="../assets/logo-wordmark-light.svg" alt="Гавань" style={{ height: 52, alignSelf: 'flex-start' }} />
            <div style={{ fontSize: '0.6875rem', fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--sand-400)' }}>Розділи сайту</div>
            <nav style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              {NAV.map(([id, label, icon]) => (
                <button key={id} onClick={() => { setTab(id); setNav(false); }} style={{
                  display: 'flex', alignItems: 'center', gap: 10, textAlign: 'left', cursor: 'pointer',
                  fontFamily: 'var(--font-sans)', fontSize: '0.9375rem', fontWeight: tab === id ? 700 : 500,
                  color: tab === id ? 'var(--teal-900)' : 'rgba(244,239,230,0.82)',
                  background: tab === id ? 'var(--sand-400)' : 'transparent',
                  border: 'none', borderRadius: 8, padding: '11px 13px',
                }}><AIcon icon={icon} size={17} /> {label}</button>
              ))}
            </nav>
            <div style={{ marginTop: 'auto', display: 'flex', flexDirection: 'column', gap: 8 }}>
              <a href="../index.html" target="_blank" rel="noopener" style={{ display: 'flex', alignItems: 'center', gap: 8, color: 'var(--teal-200)', fontSize: '0.875rem', fontWeight: 600, textDecoration: 'none' }}>
                <AIcon icon="ExternalLink" size={16} /> Відкрити сайт
              </a>
              <button onClick={reset} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'transparent', border: 'none', cursor: 'pointer', color: 'rgba(244,239,230,0.5)', fontFamily: 'var(--font-sans)', fontSize: '0.8125rem', padding: 0 }}>
                <AIcon icon="RotateCcw" size={15} /> Скинути все
              </button>
              <button onClick={onLogout} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'transparent', border: 'none', cursor: 'pointer', color: 'rgba(244,239,230,0.5)', fontFamily: 'var(--font-sans)', fontSize: '0.8125rem', padding: 0 }}>
                <AIcon icon="LogOut" size={15} /> Вийти
              </button>
            </div>
          </aside>

          {/* Main */}
          <main style={{ display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <header style={{ position: 'sticky', top: 0, zIndex: 20, background: 'rgba(245,239,227,0.92)', backdropFilter: 'blur(10px)', borderBottom: '1px solid var(--ink-100)', padding: '18px 32px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 20 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <button className="nav-toggle" aria-label="Меню" onClick={() => setNav(true)}
                  style={{ display: 'none', alignItems: 'center', justifyContent: 'center', width: 42, height: 42, flex: 'none',
                    background: 'var(--teal-900)', color: 'var(--cream-50)', border: 'none', borderRadius: 8, cursor: 'pointer' }}>
                  <AIcon icon="Menu" size={20} />
                </button>
                <div>
                <h2 style={{ fontFamily: 'var(--font-display)', fontSize: '1.5rem', color: 'var(--ink-900)', margin: 0 }}>
                  {(NAV.find((n) => n[0] === tab) || [])[1]}
                </h2>
                <span style={{ fontSize: '0.8125rem', color: dirty ? 'var(--amber-600)' : 'var(--ink-500)', fontWeight: dirty ? 600 : 500 }}>
                  {dirty ? '● Є незбережені зміни' : 'Усі зміни збережено'}
                </span>
                {live !== null && (
                  <div style={{
                    marginTop: 6, display: 'inline-flex', alignItems: 'center', gap: 7,
                    fontFamily: 'var(--font-sans)', fontSize: '0.8125rem', fontWeight: 700,
                    padding: '5px 10px', borderRadius: 999,
                    background: isLive ? 'var(--green-100)' : 'var(--amber-100)',
                    color: isLive ? 'var(--green-600)' : 'var(--amber-600)',
                  }}>
                    <AIcon icon={isLive ? 'CheckCircle2' : 'AlertTriangle'} size={14} />
                    {isLive ? 'Опубліковано — телефони бачать ці зміни' : 'Не опубліковано — на телефонах старий вміст'}
                  </div>
                )}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                <button onClick={() => importRef.current.click()} style={{ ...ghostBtn, background: '#fff', borderColor: 'var(--ink-200)', color: 'var(--ink-700)' }}>
                  <AIcon icon="Upload" size={16} /> Імпорт
                </button>
                <button onClick={publishNow} disabled={pubBusy} style={{ ...ghostBtn, background: '#fff', borderColor: 'var(--ink-200)', color: 'var(--ink-700)', opacity: pubBusy ? 0.6 : 1 }}>
                  <AIcon icon={ghReady ? 'UploadCloud' : 'Download'} size={16} /> {pubBusy ? 'Публікую…' : 'Опублікувати'}
                </button>
                <button onClick={save} style={{
                  display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer',
                  fontFamily: 'var(--font-sans)', fontSize: '0.9375rem', fontWeight: 700,
                  color: 'var(--ink-900)', background: 'var(--sand-500)', border: '1px solid var(--sand-500)',
                  borderRadius: 8, padding: '11px 20px',
                }}><AIcon icon="Save" size={17} /> Зберегти</button>
                <input ref={importRef} type="file" accept=".json" style={{ display: 'none' }} onChange={(e) => importJson(e.target.files[0])} />
              </div>
            </header>
            <div style={{ padding: '28px 32px 60px', maxWidth: 1040 }}>
              <Current c={content} up={up} />
            </div>
          </main>

          {publish && (
            <div onClick={() => setPublish(false)} style={{ position: 'fixed', inset: 0, zIndex: 200, background: 'rgba(12,59,62,0.62)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
              <div onClick={(e) => e.stopPropagation()} style={{ background: '#fff', borderRadius: 14, padding: 28, maxWidth: 520, width: '100%', boxShadow: '0 30px 80px rgba(0,0,0,0.3)' }}>
                <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '1.375rem', color: 'var(--ink-900)', margin: '0 0 10px' }}>Файл content.json завантажено</h3>
                <p style={{ fontFamily: 'var(--font-sans)', fontSize: '0.9375rem', color: 'var(--ink-600)', lineHeight: 1.6, margin: '0 0 16px' }}>
                  Щоб зміни побачили <b>всі</b> — і на телефонах, і в інших відвідувачів — залийте цей файл у корінь репозиторію на GitHub. <b>Або налаштуйте розділ «Публікація»</b> — тоді зміни зберігатимуться на сайт однією кнопкою, без завантаження файлів:
                </p>
                <ol style={{ fontFamily: 'var(--font-sans)', fontSize: '0.9375rem', color: 'var(--ink-700)', lineHeight: 1.7, margin: '0 0 18px', paddingLeft: 22 }}>
                  <li>Відкрийте репозиторій → <b>Add file → Upload files</b></li>
                  <li>Перетягніть щойно завантажений <b>content.json</b></li>
                  <li><b>Commit changes</b> — за 1–2 хв зміни на сайті</li>
                </ol>
                <p style={{ fontFamily: 'var(--font-sans)', fontSize: '0.8125rem', color: 'var(--ink-500)', margin: '0 0 20px' }}>
                  Кнопка «Зберегти» діє лише в цьому браузері — вона не оновлює сайт для інших.
                </p>
                <button onClick={() => setPublish(false)} style={{ width: '100%', cursor: 'pointer', fontFamily: 'var(--font-sans)', fontSize: '0.9375rem', fontWeight: 700, color: 'var(--ink-900)', background: 'var(--sand-500)', border: 'none', borderRadius: 8, padding: '12px 20px' }}>Зрозуміло</button>
              </div>
            </div>
          )}
          {toast && (
            <div style={{ position: 'fixed', bottom: 26, left: '50%', transform: 'translateX(-50%)', zIndex: 100, background: 'var(--ink-900)', color: 'var(--cream-50)', padding: '13px 22px', borderRadius: 10, boxShadow: '0 18px 48px rgba(0,0,0,0.3)', fontFamily: 'var(--font-sans)', fontSize: '0.9375rem', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 10 }}>
              <AIcon icon="Check" size={17} /> {toast}
            </div>
          )}
        </div>
      );
    }
    function Root() {
      const [authed, setAuthed] = React.useState(() => !!readSession());
      if (!authed) return <LoginScreen onOk={() => setAuthed(true)} />;
      return <App onLogout={() => { clearSession(); setAuthed(false); }} />;
    }
    ReactDOM.createRoot(document.getElementById('admin')).render(<Root/>);
  </script>

  <script>
  // Якщо панель не намалювалась — показуємо, який файл не завантажився,
  // замість порожньої білої сторінки.
  window.addEventListener('error', function (e) {
    window.__admErr = (window.__admErr || []);
    window.__admErr.push((e.filename || '') + ' ' + (e.message || ''));
  });
  window.addEventListener('load', function () {
    setTimeout(async function () {
      var root = document.getElementById('admin');
      if (!root || root.children.length > 0) return;
      var need = ['../ds-bundle.js','../styles.css','admin-core.jsx','admin-auth.jsx','admin-github.jsx','admin-sections.jsx'];
      var rows = '';
      for (var i = 0; i < need.length; i++) {
        var ok = false, code = '—';
        try { var r = await fetch(need[i], { cache: 'reload' }); ok = r.ok; code = r.status; }
        catch (err) { code = 'нема звʼязку'; }
        rows += '<tr><td style="padding:7px 16px 7px 0;font-family:monospace;font-size:13px">' + need[i] + '</td>'
             +  '<td style="padding:7px 0;font-weight:700;color:' + (ok ? '#7BD2A6' : '#FF9C8F') + '">'
             +  (ok ? 'OK' : 'НЕ ЗНАЙДЕНО (' + code + ')') + '</td></tr>';
      }
      var ns = (window.DesignSystem_0f1a06 ? 'завантажено ✓' : 'НЕ завантажено');
      var errs = (window.__admErr || []).join('<br>');
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;'
        + 'font-family:Manrope,system-ui,sans-serif;background:#0B1817;color:#F4EFE6">'
        + '<div style="max-width:660px;width:100%">'
        + '<h1 style="font-size:24px;margin:0 0 6px">Адмін-панель не завантажилась</h1>'
        + '<p style="opacity:.7;margin:0 0 22px;font-size:15px">Нижче — які файли знайдено. Залийте ті, що позначені червоним.</p>'
        + '<table style="border-collapse:collapse;width:100%">' + rows + '</table>'
        + '<p style="margin:20px 0 0;font-size:14px">Бібліотека компонентів: <b>' + ns + '</b></p>'
        + (errs ? '<p style="opacity:.6;margin:14px 0 0;font-size:12px;line-height:1.6">' + errs + '</p>' : '')
        + '<p style="opacity:.6;margin:18px 0 0;font-size:13px;line-height:1.6">Найчастіша причина: файл <b>admin-github.jsx</b> не залитий у папку <b>admin/</b>, '
        + 'або бібліотека лежить у корені під іншою назвою (потрібна <b>ds-bundle.js</b>, не <b>_ds_bundle.js</b>).</p>'
        + '</div></div>';
    }, 1500);
  });
  </script>
</body></html>
